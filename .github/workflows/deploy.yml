name: Deploy

# Forge pulls and deploys the branch itself; this workflow only triggers it once CI is green.
# Quick Deploy stays off in Forge so an untested push never goes live.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    steps:
      - name: Trigger Forge deploy hook
        env:
          HOOK: ${{ secrets.FORGE_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::No FORGE_DEPLOY_HOOK_API secret in this environment; skipping."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
